<svg xmlns="http://www.w3.org/2000/svg" class="hc" viewBox="0 0 900 1002" width="900" height="1002" role="img" aria-label="WeAct STM32WB55CGU6 pad map: every pad, its category and what it connects to">
<style>
:root{--surface:#ffffff;--surface-2:#f4f6f8;--ink:#161a1d;--muted:#586067;--border:#d3d9de;--border-strong:#b6bfc7;--accent:#0072b2;--direct-bg:#dcebf7;--direct-fg:#08466e;--direct-bd:#6ea9d4;--shared-bg:#fbe8cd;--shared-fg:#8a5000;--shared-bd:#e2ac57;--leave-bg:#e6e7e5;--leave-fg:#464a4a;--leave-bd:#bfc3c1;--danger-bg:#f4dced;--danger-fg:#7a2a60;--danger-bd:#d69cc4}
@media (prefers-color-scheme:dark){:root{--surface:#161b1f;--surface-2:#1c2227;--ink:#e7ecf0;--muted:#93a0aa;--border:#2a333a;--border-strong:#3c4750;--accent:#5cb3e6;--direct-bg:#12304a;--direct-fg:#8fc4ea;--direct-bd:#2f5f86;--shared-bg:#3a2a10;--shared-fg:#f0bc6e;--shared-bd:#6f501f;--leave-bg:#2a2e31;--leave-fg:#c3cace;--leave-bd:#454d52;--danger-bg:#331a2c;--danger-fg:#e79cc9;--danger-bd:#6a3357}}
.hc .bg{fill:var(--surface);stroke:var(--border);stroke-width:1}

.hc text{font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink)}
.hc .title{font-weight:700;font-size:20px}
.hc .cap{fill:var(--muted);font-size:12.5px}
.hc .leg{font-size:13px}
.hc .side{fill:var(--muted);font-size:11px;font-weight:600;letter-spacing:.12em}
.hc .board{fill:var(--surface-2);stroke:var(--border-strong);stroke-width:1.5}
.hc .usb,.hc .mcu{fill:var(--surface);stroke:var(--ink);stroke-width:1.4}
.hc .ant{fill:var(--surface);stroke:var(--border-strong);stroke-width:1;stroke-dasharray:5 4}
.hc .pad{stroke-width:1.5}
.hc .pad.direct{fill:var(--direct-bg);stroke:var(--direct-bd)} .hc .pad.shared{fill:var(--shared-bg);stroke:var(--shared-bd)}
.hc .pad.leave{fill:var(--leave-bg);stroke:var(--leave-bd)} .hc .pad.danger{fill:var(--danger-bg);stroke:var(--danger-bd)}
.hc .pin,.hc .num,.hc .cat{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
.hc .pin{font-weight:600;font-size:15px} .hc .cat{font-weight:700;font-size:11px}
.hc .direct{fill:var(--direct-fg)} .hc .shared{fill:var(--shared-fg)} .hc .leave{fill:var(--leave-fg)} .hc .danger{fill:var(--danger-fg)}
.hc .num{fill:var(--muted);font-size:11px;font-weight:600}
.hc .fn{font-size:13px}
.hc rect.pad.direct{fill:var(--direct-bg)} .hc rect.pad.shared{fill:var(--shared-bg)}
.hc rect.pad.leave{fill:var(--leave-bg)} .hc rect.pad.danger{fill:var(--danger-bg)}
</style>
