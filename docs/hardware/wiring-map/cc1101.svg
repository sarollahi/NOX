<svg xmlns="http://www.w3.org/2000/svg" class="hc" viewBox="0 0 760 400" width="760" height="400" role="img" aria-label="CC1101 8-pin module pinout with each pin's connection">
<style>
:root{--surface:#ffffff;--surface-2:#f4f6f8;--ink:#161a1d;--muted:#586067;--border:#d3d9de;--border-strong:#b6bfc7;--accent:#0072b2;--direct-bg:#dcebf7;--direct-fg:#08466e;--direct-bd:#6ea9d4;--shared-bg:#fbe8cd;--shared-fg:#8a5000;--shared-bd:#e2ac57;--leave-bg:#e6e7e5;--leave-fg:#464a4a;--leave-bd:#bfc3c1;--danger-bg:#f4dced;--danger-fg:#7a2a60;--danger-bd:#d69cc4}
@media (prefers-color-scheme:dark){:root{--surface:#161b1f;--surface-2:#1c2227;--ink:#e7ecf0;--muted:#93a0aa;--border:#2a333a;--border-strong:#3c4750;--accent:#5cb3e6;--direct-bg:#12304a;--direct-fg:#8fc4ea;--direct-bd:#2f5f86;--shared-bg:#3a2a10;--shared-fg:#f0bc6e;--shared-bd:#6f501f;--leave-bg:#2a2e31;--leave-fg:#c3cace;--leave-bd:#454d52;--danger-bg:#331a2c;--danger-fg:#e79cc9;--danger-bd:#6a3357}}
.hc .bg{fill:var(--surface);stroke:var(--border);stroke-width:1}
.hc .chip{fill:var(--surface-2);stroke:var(--ink);stroke-width:1.6}
.hc .chip-notch{fill:var(--surface);stroke:var(--ink);stroke-width:1.4}
.hc text{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:13px;fill:var(--ink)}
.hc .chipname{font-family:"IBM Plex Sans",system-ui,sans-serif;font-weight:700;font-size:17px}
.hc .cap{fill:var(--muted);font-size:12px}
.hc .pnum{fill:var(--muted);font-size:11px;font-weight:600}
.hc .pname{font-weight:600;font-size:12.5px}
.hc .pinline{stroke:var(--ink);stroke-width:3}
.hc .w-m,.hc .w-b,.hc .w-r,.hc .w-n,.hc .sw{fill:none;stroke-width:2}
.hc .w-m{stroke:var(--direct-fg)} .hc .t-m{fill:var(--direct-fg);font-weight:600}
.hc .w-b{stroke:var(--accent)} .hc .t-b{fill:var(--accent);font-weight:600}
.hc .w-r{stroke:var(--shared-fg)} .hc .t-r{fill:var(--shared-fg);font-weight:600}
.hc .w-n{stroke:var(--leave-fg);stroke-dasharray:4 4} .hc .t-n{fill:var(--leave-fg)}
.hc .sw{stroke:var(--ink)} .hc .node{fill:var(--ink)}
.hc .res{fill:var(--surface);stroke:var(--ink);stroke-width:1.6}
</style>
<rect class="bg" x="0.5" y="0.5" width="759" height="399" rx="12"/>
<rect class="chip" x="250" y="40" width="390" height="250" rx="8"/><text class="pnum" x="276" y="74" text-anchor="middle">1</text><text class="pnum" x="326" y="74" text-anchor="middle">2</text><text class="pnum" x="276" y="270" text-anchor="middle">7</text><text class="pnum" x="326" y="270" text-anchor="middle">8</text><rect class="res" x="640" y="138" width="90" height="54" rx="4"/><text class="cap" x="685" y="170" text-anchor="middle">SMA</text><text class="chipname" x="560" y="80" text-anchor="middle">433M</text><text class="cap" x="560" y="270" text-anchor="middle">V2.0</text><rect class="res" x="470" y="130" width="60" height="60" rx="4"/><text class="cap" x="500" y="164" text-anchor="middle">CC1101</text><line class="w-r" x1="150" y1="100" x2="265" y2="100"/><rect class="chip" x="265" y="89" width="22" height="22" rx="0"/><text class="pnum" x="276" y="104" text-anchor="middle">1</text><text class="t-r" x="144" y="104" text-anchor="end">GND → GND rail</text><rect class="res" x="315" y="89" width="22" height="22" rx="11"/><text class="pnum" x="326" y="104" text-anchor="middle">2</text><line class="w-r" x1="337" y1="100" x2="354" y2="100"/><text class="t-r" x="360" y="104">VCC → 3V3 (not 5 V)</text><line class="w-m" x1="150" y1="144" x2="265" y2="144"/><rect class="res" x="265" y="133" width="22" height="22" rx="11"/><text class="pnum" x="276" y="148" text-anchor="middle">3</text><text class="t-m" x="144" y="148" text-anchor="end">GDO0 → PA1</text><rect class="res" x="315" y="133" width="22" height="22" rx="11"/><text class="pnum" x="326" y="148" text-anchor="middle">4</text><line class="w-m" x1="337" y1="144" x2="354" y2="144"/><text class="t-m" x="360" y="148">CSN → PA7</text><line class="w-m" x1="150" y1="188" x2="265" y2="188"/><rect class="res" x="265" y="177" width="22" height="22" rx="11"/><text class="pnum" x="276" y="192" text-anchor="middle">5</text><text class="t-m" x="144" y="192" text-anchor="end">SCK → PB3</text><rect class="res" x="315" y="177" width="22" height="22" rx="11"/><text class="pnum" x="326" y="192" text-anchor="middle">6</text><line class="w-m" x1="337" y1="188" x2="354" y2="188"/><text class="t-m" x="360" y="192">MOSI → PB5</text><line class="w-m" x1="150" y1="232" x2="265" y2="232"/><rect class="res" x="265" y="221" width="22" height="22" rx="11"/><text class="pnum" x="276" y="236" text-anchor="middle">7</text><text class="t-m" x="144" y="236" text-anchor="end">MISO → PB4</text><rect class="res" x="315" y="221" width="22" height="22" rx="11"/><text class="pnum" x="326" y="236" text-anchor="middle">8</text><line class="w-n" x1="337" y1="232" x2="354" y2="232"/><text class="t-n" x="360" y="236">GDO2 → leave open</text><text class="cap" x="20" y="330">Seen as in the photo: chip side up, header left, SMA right.</text><text class="cap" x="20" y="350">Square pad = pin 1. Odd pins 1·3·5·7 on the board edge, even 2·4·6·8 inside.</text><line class="w-m" x1="20" y1="378" x2="50" y2="378"/><text class="cap" x="58" y="382">to MCU / SPI bus</text><line class="w-r" x1="210" y1="378" x2="240" y2="378"/><text class="cap" x="248" y="382">3V3 / GND rail</text><line class="w-n" x1="380" y1="378" x2="410" y2="378"/><text class="cap" x="418" y="382">not connected</text>
</svg>
