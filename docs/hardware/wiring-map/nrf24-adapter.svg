<svg xmlns="http://www.w3.org/2000/svg" class="hc" viewBox="0 0 760 510" width="760" height="510" role="img" aria-label="nRF24 breakout adapter pinout with each pin's connection">
<style>
:root{--surface:#ffffff;--surface-2:#f4f6f8;--ink:#161a1d;--muted:#586067;--border:#d3d9de;--border-strong:#b6bfc7;--accent:#0072b2;--direct-bg:#dcebf7;--direct-fg:#08466e;--direct-bd:#6ea9d4;--shared-bg:#fbe8cd;--shared-fg:#8a5000;--shared-bd:#e2ac57;--leave-bg:#e6e7e5;--leave-fg:#464a4a;--leave-bd:#bfc3c1;--danger-bg:#f4dced;--danger-fg:#7a2a60;--danger-bd:#d69cc4}
@media (prefers-color-scheme:dark){:root{--surface:#161b1f;--surface-2:#1c2227;--ink:#e7ecf0;--muted:#93a0aa;--border:#2a333a;--border-strong:#3c4750;--accent:#5cb3e6;--direct-bg:#12304a;--direct-fg:#8fc4ea;--direct-bd:#2f5f86;--shared-bg:#3a2a10;--shared-fg:#f0bc6e;--shared-bd:#6f501f;--leave-bg:#2a2e31;--leave-fg:#c3cace;--leave-bd:#454d52;--danger-bg:#331a2c;--danger-fg:#e79cc9;--danger-bd:#6a3357}}
.hc .bg{fill:var(--surface);stroke:var(--border);stroke-width:1}
.hc .chip{fill:var(--surface-2);stroke:var(--ink);stroke-width:1.6}
.hc .chip-notch{fill:var(--surface);stroke:var(--ink);stroke-width:1.4}
.hc text{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:13px;fill:var(--ink)}
.hc .chipname{font-family:"IBM Plex Sans",system-ui,sans-serif;font-weight:700;font-size:17px}
.hc .cap{fill:var(--muted);font-size:12px}
.hc .pnum{fill:var(--muted);font-size:11px;font-weight:600}
.hc .pname{font-weight:600;font-size:12.5px}
.hc .pinline{stroke:var(--ink);stroke-width:3}
.hc .w-m,.hc .w-b,.hc .w-r,.hc .w-n,.hc .sw{fill:none;stroke-width:2}
.hc .w-m{stroke:var(--direct-fg)} .hc .t-m{fill:var(--direct-fg);font-weight:600}
.hc .w-b{stroke:var(--accent)} .hc .t-b{fill:var(--accent);font-weight:600}
.hc .w-r{stroke:var(--shared-fg)} .hc .t-r{fill:var(--shared-fg);font-weight:600}
.hc .w-n{stroke:var(--leave-fg);stroke-dasharray:4 4} .hc .t-n{fill:var(--leave-fg)}
.hc .sw{stroke:var(--ink)} .hc .node{fill:var(--ink)}
.hc .res{fill:var(--surface);stroke:var(--ink);stroke-width:1.6}
</style>
<rect class="bg" x="0.5" y="0.5" width="759" height="509" rx="12"/>
<rect class="chip" x="300" y="30" width="200" height="380" rx="8"/><text class="chipname" x="420" y="60" text-anchor="middle">Adapter</text><text class="cap" x="420" y="78" text-anchor="middle">1×8 header</text><rect class="res" x="370" y="150" width="110" height="150" rx="6"/><text class="cap" x="425" y="216" text-anchor="middle">nRF24L01+</text><text class="cap" x="425" y="234" text-anchor="middle">PA+LNA</text><line class="w-n" x1="425" y1="150" x2="425" y2="110"/><text class="cap" x="434" y="122">antenna</text><line class="w-r" x1="140" y1="110" x2="314" y2="110"/><rect class="chip" x="314" y="99" width="22" height="22" rx="0"/><text class="pname" x="344" y="114">VCC</text><text class="t-r" x="134" y="114" text-anchor="end">3V3 rail</text><text class="pnum" x="560" y="114">module pin 2</text><line class="w-r" x1="140" y1="150" x2="314" y2="150"/><rect class="res" x="314" y="139" width="22" height="22" rx="11"/><text class="pname" x="344" y="154">GND</text><text class="t-r" x="134" y="154" text-anchor="end">GND rail</text><text class="pnum" x="560" y="154">module pin 1</text><line class="w-m" x1="140" y1="190" x2="314" y2="190"/><rect class="res" x="314" y="179" width="22" height="22" rx="11"/><text class="pname" x="344" y="194">CE</text><text class="t-m" x="134" y="194" text-anchor="end">PE4 · MCU</text><text class="pnum" x="560" y="194">module pin 3</text><line class="w-m" x1="140" y1="230" x2="314" y2="230"/><rect class="res" x="314" y="219" width="22" height="22" rx="11"/><text class="pname" x="344" y="234">CSN</text><text class="t-m" x="134" y="234" text-anchor="end">PA9 · MCU</text><text class="pnum" x="560" y="234">module pin 4</text><line class="w-m" x1="140" y1="270" x2="314" y2="270"/><rect class="res" x="314" y="259" width="22" height="22" rx="11"/><text class="pname" x="344" y="274">SCK</text><text class="t-m" x="134" y="274" text-anchor="end">PB3 · bus</text><text class="pnum" x="560" y="274">module pin 5</text><line class="w-m" x1="140" y1="310" x2="314" y2="310"/><rect class="res" x="314" y="299" width="22" height="22" rx="11"/><text class="pname" x="344" y="314">MO</text><text class="t-m" x="134" y="314" text-anchor="end">PB5 · bus (MOSI)</text><text class="pnum" x="560" y="314">module pin 6</text><line class="w-m" x1="140" y1="350" x2="314" y2="350"/><rect class="res" x="314" y="339" width="22" height="22" rx="11"/><text class="pname" x="344" y="354">MI</text><text class="t-m" x="134" y="354" text-anchor="end">PB4 · bus (MISO)</text><text class="pnum" x="560" y="354">module pin 7</text><line class="w-n" x1="140" y1="390" x2="314" y2="390"/><rect class="res" x="314" y="379" width="22" height="22" rx="11"/><text class="pname" x="344" y="394">IRQ</text><text class="t-n" x="134" y="394" text-anchor="end">leave open</text><text class="pnum" x="560" y="394">module pin 8</text><text class="cap" x="20" y="440">Wire by the printed labels: header order differs between adapters.</text><text class="cap" x="20" y="460">Right column = matching pin on the bare 2×4 module, if you skip the adapter.</text><line class="w-m" x1="20" y1="488" x2="50" y2="488"/><text class="cap" x="58" y="492">to MCU / SPI bus</text><line class="w-r" x1="210" y1="488" x2="240" y2="488"/><text class="cap" x="248" y="492">3V3 / GND rail</text><line class="w-n" x1="380" y1="488" x2="410" y2="488"/><text class="cap" x="418" y="492">not connected</text>
</svg>
