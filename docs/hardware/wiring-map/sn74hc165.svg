<svg xmlns="http://www.w3.org/2000/svg" class="hc" viewBox="0 0 780 590" width="780" height="590" role="img" aria-label="SN74HC165 DIP-16 pinout with each pin's connection">
<style>
:root{--surface:#ffffff;--surface-2:#f4f6f8;--ink:#161a1d;--muted:#586067;--border:#d3d9de;--border-strong:#b6bfc7;--accent:#0072b2;--direct-bg:#dcebf7;--direct-fg:#08466e;--direct-bd:#6ea9d4;--shared-bg:#fbe8cd;--shared-fg:#8a5000;--shared-bd:#e2ac57;--leave-bg:#e6e7e5;--leave-fg:#464a4a;--leave-bd:#bfc3c1;--danger-bg:#f4dced;--danger-fg:#7a2a60;--danger-bd:#d69cc4}
@media (prefers-color-scheme:dark){:root{--surface:#161b1f;--surface-2:#1c2227;--ink:#e7ecf0;--muted:#93a0aa;--border:#2a333a;--border-strong:#3c4750;--accent:#5cb3e6;--direct-bg:#12304a;--direct-fg:#8fc4ea;--direct-bd:#2f5f86;--shared-bg:#3a2a10;--shared-fg:#f0bc6e;--shared-bd:#6f501f;--leave-bg:#2a2e31;--leave-fg:#c3cace;--leave-bd:#454d52;--danger-bg:#331a2c;--danger-fg:#e79cc9;--danger-bd:#6a3357}}
.hc .bg{fill:var(--surface);stroke:var(--border);stroke-width:1}
.hc .chip{fill:var(--surface-2);stroke:var(--ink);stroke-width:1.6}
.hc .chip-notch{fill:var(--surface);stroke:var(--ink);stroke-width:1.4}
.hc text{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:13px;fill:var(--ink)}
.hc .chipname{font-family:"IBM Plex Sans",system-ui,sans-serif;font-weight:700;font-size:17px}
.hc .cap{fill:var(--muted);font-size:12px}
.hc .pnum{fill:var(--muted);font-size:11px;font-weight:600}
.hc .pname{font-weight:600;font-size:12.5px}
.hc .pinline{stroke:var(--ink);stroke-width:3}
.hc .w-m,.hc .w-b,.hc .w-r,.hc .w-n,.hc .sw{fill:none;stroke-width:2}
.hc .w-m{stroke:var(--direct-fg)} .hc .t-m{fill:var(--direct-fg);font-weight:600}
.hc .w-b{stroke:var(--accent)} .hc .t-b{fill:var(--accent);font-weight:600}
.hc .w-r{stroke:var(--shared-fg)} .hc .t-r{fill:var(--shared-fg);font-weight:600}
.hc .w-n{stroke:var(--leave-fg);stroke-dasharray:4 4} .hc .t-n{fill:var(--leave-fg)}
.hc .sw{stroke:var(--ink)} .hc .node{fill:var(--ink)}
.hc .res{fill:var(--surface);stroke:var(--ink);stroke-width:1.6}
</style>
<rect class="bg" x="0.5" y="0.5" width="779" height="589" rx="12"/>
