</text><line class="w-n" x1="120" y1="300" x2="244" y2="300"/><text class="t-n" x="114" y="304" text-anchor="end">leave open</text><line class="pinline" x1="244" y1="340" x2="260" y2="340"/><text class="pnum" x="270" y="344">8</text><text class="pname" x="292" y="344">GND</text><line class="w-r" x1="120" y1="340" x2="244" y2="340"/><text class="t-r" x="114" y="344" text-anchor="end">GND</text><line class="pinline" x1="500" y1="60" x2="516" y2="60"/><text class="pnum" x="490" y="64" text-anchor="end">16</text><text class="pname" x="468" y="64" text-anchor="end">VCC</text><line class="w-r" x1="516" y1="60" x2="640" y2="60"/><text class="t-r" x="646" y="64">3V3</text><line class="pinline" x1="500" y1="100" x2="516" y2="100"/><text class="pnum" x="490" y="104" text-anchor="end">15</text><text class="pname" x="468" y="104" text-anchor="end">CLK INH</text><line class="w-r" x1="516" y1="100" x2="640" y2="100"/><text class="t-r" x="646" y="104">GND</text><line class="pinline" x1="500" y1="140" x2="516" y2="140"/><text class="pnum" x="490" y="144" text-anchor="end">14</text><text class="pname" x="468" y="144" text-anchor="end">D · D3</text><line class="w-b" x1="516" y1="140" x2="640" y2="140"/><text class="t-b" x="646" y="144">Left button</text><line class="pinline" x1="500" y1="180" x2="516" y2="180"/><text class="pnum" x="490" y="184" text-anchor="end">13</text><text class="pname" x="468" y="184" text-anchor="end">C · D2</text><line class="w-b" x1="516" y1="180" x2="640" y2="180"/><text class="t-b" x="646" y="184">Right button</text><line class="pinline" x1="500" y1="220" x2="516" y2="220"/><text class="pnum" x="490" y="224" text-anchor="end">12</text><text class="pname" x="468" y="224" text-anchor="end">B · D1</text><line class="w-b" x1="516" y1="220" x2="640" y2="220"/><text class="t-b" x="646" y="224">Down button</text><line class="pinline" x1="500" y1="260" x2="516" y2="260"/><text class="pnum" x="490" y="264" text-anchor="end">11</text><text class="pname" x="468" y="2