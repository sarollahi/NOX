name: Release firmware

# Tag a commit and push it to build + publish a release:
#   git tag v0.1.0 && git push origin v0.1.0
# Manual runs (workflow_dispatch) build the artifacts without publishing.

on:
  push:
    branches: ["main"]   # builds on every push to main
    tags: ["v*"]          # tag on main to publish a release
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y git build-essential

      - name: Build firmware (f55 target)
        run: |
          chmod +x fbt
          # Accept the one-time SDK API finalization if the build stops on it.
          if ! ./fbt TARGET_HW=55 COMPACT=1 DEBUG=0 updater_package; then
            for csv in targets/f55/api_symbols.csv targets/f7/api_symbols.csv; do
              [ -f "$csv" ] && sed -i -E 's/^([A-Za-z]+),\?,/\1,+,/; s/^Version,v,/Version,+,/' "$csv"
            done
            ./fbt TARGET_HW=55 COMPACT=1 DEBUG=0 updater_package
          fi

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp dist/f55-C/flipper-z-f55-full-local.bin out/nox-firmware.bin
          cp dist/f55-C/flipper-z-f55-full-local.dfu out/nox-firmware.dfu
          cd out && sha256sum nox-firmware.* > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nox-firmware
          path: out/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          body: |
            ## NOX firmware ${{ github.ref_name }}

            Flash `nox-firmware.bin` at `0x08000000`, or install `nox-firmware.dfu` with qFlipper.
            See [docs/setup.md](docs/setup.md). Verify against `SHA256SUMS.txt`.
