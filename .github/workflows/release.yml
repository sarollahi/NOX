name: Release firmware

# Tag a commit and push it to build + publish a release:
#   git tag v0.1.0 && git push origin v0.1.0
# Manual runs (workflow_dispatch) build the artifacts without publishing.

on:
  push:
    branches: ["main"]   # builds on every push to main
    tags: ["v*"]          # tag on main to publish a release
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y git build-essential

      - name: Build firmware (f55 target)
        run: |
          chmod +x fbt
          # Accept the one-time SDK API finalization if the build stops on it.
          if ! ./fbt TARGET_HW=55 COMPACT=1 DEBUG=0 updater_package; then
            for csv in targets/f55/api_symbols.csv targets/f7/api_symbols.csv; do
              [ -f "$csv" ] && sed -i -E 's/^([A-Za-z]+),\?,/\1,+,/; s/^Version,v,/Version,+,/' "$csv"
            done
            ./fbt TARGET_HW=55 COMPACT=1 DEBUG=0 updater_package
          fi

      - name: Collect artifacts
        run: |
          mkdir -p out
          # DIST_SUFFIX defaults to "local", so dist/f55-C/ holds flipper-z-f55-*-local.*
          cp dist/f55-C/flipper-z-f55-full-local.bin out/nox-firmware.bin
          cp dist/f55-C/flipper-z-f55-full-local.dfu out/nox-firmware.dfu
          # Full update bundle: fw + radio stack + resources + manifest. This is the easy
          # install path (qFlipper "Install from file" / lab.flipper.net) and updater_package
          # already builds it, so ship it instead of discarding it.
          cp dist/f55-C/flipper-z-f55-update-local.tgz out/nox-update.tgz
          # Unstripped ELF: needed to symbolise a crash dump or attach a debugger to a release.
          cp dist/f55-C/flipper-z-f55-firmware-local.elf out/nox-firmware.elf
          # SDK bundle: lets anyone build a .fap against this exact firmware without the
          # firmware tree (ufbt --sdk-file=...). Produced by updater_package alongside the rest.
          cp dist/f55-C/flipper-z-f55-sdk-local.zip out/nox-sdk.zip
          cd out && sha256sum nox-* > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Check firmware fits below the BLE radio stack
        run: |
          # The BLE radio stack lives near the top of the same 1MB flash and the linker does
          # NOT reserve it, so an oversized image silently overwrites it: CPU2 gets garbage and
          # the board hardfaults before USB init, with no way back in over USB.
          # See targets/f55/README_NOX.md 10.2.
          #
          # Corroborated bounds: 812,604 bytes boots and runs; ~864K bricked a board. The
          # radio stack sits at 0x080D7000, i.e. 880,640 bytes in, which is consistent with
          # both observations. Gate below that with a margin.
          STACK_OFFSET=880640      # 0x080D7000 - 0x08000000
          MARGIN=8192
          LIMIT=$(( STACK_OFFSET - MARGIN ))
          SIZE=$(stat -c%s out/nox-firmware.bin)
          echo "firmware: $SIZE bytes / limit $LIMIT (radio stack at $STACK_OFFSET)"
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "::error::Firmware is $SIZE bytes, over the $LIMIT limit. It would overwrite"
            echo "::error::the BLE radio stack and brick the board. Drop apps or confirm the"
            echo "::error::real stack address with STM32CubeProgrammer before raising the limit."
            exit 1
          fi
          echo "::notice::Firmware $SIZE bytes, $(( LIMIT - SIZE )) bytes of headroom."

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nox-firmware
          path: out/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          body: |
            ## NOX firmware ${{ github.ref_name }}

            | Asset | Use |
            |---|---|
            | `nox-update.tgz` | **Easiest install.** qFlipper "Install from file", or lab.flipper.net. Firmware + radio stack + SD resources in one bundle. |
            | `nox-firmware.dfu` | Firmware only, via qFlipper or STM32CubeProgrammer. |
            | `nox-firmware.bin` | Firmware only, flash at `0x08000000`. |
            | `nox-sdk.zip` | Build your own `.fap` against this build: `ufbt --sdk-file=nox-sdk.zip`. |
            | `nox-firmware.elf` | Unstripped ELF for debugging and crash-dump symbolisation. |

            Verify downloads against `SHA256SUMS.txt`. Setup and wiring: [docs/setup.md](docs/setup.md).
